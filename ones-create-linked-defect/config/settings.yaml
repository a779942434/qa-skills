# ones-create-linked-defect 环境配置
#
# 所有路径留空时由 scripts/ones_config.py 按平台自动探测（Windows / macOS）；
# 也可以用环境变量覆盖，优先级：环境变量 > 本文件 > 平台默认值。
# 支持的环境变量：
#   ONES_CDP_PORT / ONES_URL
#   ONES_EDGE_EXE / ONES_EDGE_SESSION / ONES_EDGE_USER_DATA
#   ONES_LOGS_DIR / ONES_BUG_REPORTS_DIR

# 常驻浏览器 CDP 调试端口
cdp_port: 9334

# ONES 站点地址
ones_url: "https://ones.shuyilink.com"

edge:
  # Edge 可执行文件；留空自动探测（Windows: Program Files 常见路径；macOS: /Applications）
  executable: ""
  # 复制登录态后的会话目录（浏览器启动用）；留空默认 ~/.codex/tmp/edge-ones-session
  session_dir: ""
  # 本机 Edge 用户数据源（用于复制登录态）；留空自动探测
  user_data_source: ""
  # 是否隐藏浏览器窗口（默认 true：后台静默启动，不弹窗不闪退）
  # 首次登录/飞书授权时，用 `python scripts/ones_edge_server.py --visible <url>` 启动可见窗口，完成后再切回默认
  headless: true

# 日志目录；留空默认 <session_dir>/logs
logs_dir: ""

# 本地缺陷清单目录；留空默认 <项目根>/bug-reports
bug_reports_dir: ""
