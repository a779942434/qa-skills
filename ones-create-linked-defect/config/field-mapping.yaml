# ONES 缺陷字段映射（与主工单一致）
#
# 换客户项目 / 人员 / 优先级时，只改这个文件；
# SKILL.md 与 references/ones-ui.md 不写死具体值。

# 优先级（与主工单一致）
priority: "P2"

# 负责人 / 验证人 = 实际登录 ONES 的账号（动态获取，不预设姓名）
assignee: ""

# 处理人取值规则：动态取自主工单信息，不在此写死人名
#   UI 前端类 bug → 主工单"前端人员"（ones_helpers.get_parent_handlers 返回第 1 项）
#   其余类 bug → 主工单"后端人员"（同上第 2 项）
#   field-mapping.handler 即"主工单后端人员"的语义（动态获取）
handler: ""

# 产品负责人：默认取主工单产品负责人（动态，不在此配置）

# 来源项目：搜索关键词 + 完整名称
source_project:
  keyword: "可挺"
  name: "宁波可挺-1期|KH0094-01"

# 系统环境：搜索关键词 + 完整名称
system_env:
  keyword: "可挺"
  name: "t-keting-可挺集成测试（客户侧）"

# 功能模块（新）候选，按当前功能选择
function_modules:
  - "计划管理"
  - "APS模块（自动排产）"

# 证据截图 / 导入文件目录索引：功能名 -> 目录
# 注意：这是历史示例路径，实际以对应功能测试输出目录为准；
#       找不到时先按功能名搜索（人员资质/排产数据等目录不同，勿混用）。
evidence_dirs:
  "排产数据回传": 'C:\Users\lenovo\.codex\visualizations\2026\08\05\019fcff3-0102-7cd3-94cf-df207be9e8cf'

