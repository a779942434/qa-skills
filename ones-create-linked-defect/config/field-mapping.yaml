# ONES 缺陷字段映射模板（与主工单一致）
#
# 这是随仓库分发的【通用模板】，不含任何客户真实数据。
# 本机/项目真实配置（客户名、实例 URL、人员、字段 uuid、本机路径）请放在：
#   config/field-mapping.local.yaml
# 该文件已加入 .gitignore，不会进入仓库；ones_config.load_field_mapping()
# 会按「本地 > 本模板 > 内置默认」的优先级合并。

# 优先级（与主工单一致）
priority: "P2"

# 负责人 / 验证人 = 实际登录 ONES 的账号（动态获取，不预设姓名）
assignee: ""

# 处理人取值规则：动态取自主工单信息，不在此写死人名
#   UI 前端类 bug → 主工单"前端人员"（ones_helpers.get_parent_handlers 返回第 1 项）
#   其余类 bug → 主工单"后端人员"（同上第 2 项）
# 提缺陷时 UI 展示/交互类缺陷用 --handler frontend（提前端人员）；数据/逻辑类默认后端
handler: ""

# 产品负责人：默认取主工单产品负责人（动态，不在此配置）

# 来源项目：搜索关键词 + 完整名称（占位，真实值在 field-mapping.local.yaml）
source_project:
  keyword: "<客户关键词>"
  name: "<客户名>-1期|<项目编码>"

# 系统环境：搜索关键词 + 完整名称（占位，真实值在 field-mapping.local.yaml）
system_env:
  keyword: "<环境关键词>"
  name: "<环境名>（<环境归属>）"

# 功能模块（新）候选，按当前功能选择
function_modules:
  - "计划管理"

# 证据截图 / 导入文件目录索引：功能名 -> 目录（占位，真实路径在 field-mapping.local.yaml）
evidence_dirs: {}

